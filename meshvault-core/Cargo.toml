[package]
name = "meshvault-core"
version = "0.1.0"
edition = "2021"
description = "Hashing, chunking and the other building blocks of the MeshVault sync engine"
license = "GPL-3.0-only"
publish = false

[dependencies]
blake3 = "1.8"
fastcdc = "5.0"
notify = "8.2"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2.0"
unicode-normalization = "0.1.26"

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
